<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ring of Brodgar — OddPocket</title>

  <style>
    html,body{
      min-height:100%;
      margin:0;
      background:#050b13;
      color:#eaf6ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }

    .card{
      width:min(440px,100%);
      padding:28px;
      box-sizing:border-box;
      text-align:center;
      border:1px solid rgba(105,190,255,.55);
      border-radius:16px;
      background:linear-gradient(145deg,#0a2136,#050d18);
      box-shadow:0 24px 70px rgba(0,0,0,.55);
    }

    .kicker{
      color:#d8b85d;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:12px;
      font-weight:700;
    }

    h1{
      margin:12px 0 10px;
      font-size:28px;
    }

    p{
      color:#b9cfde;
      line-height:1.5;
    }

    .ar-link{
      display:block;
      margin-top:24px;
      padding:17px 20px;
      border:1px solid #d8b85d;
      border-radius:10px;
      color:#f2d882;
      text-decoration:none;
      font-weight:700;
      letter-spacing:.06em;
      background:rgba(216,184,93,.07);
    }

    .ar-link img{
      display:block;
      width:100%;
      max-height:190px;
      object-fit:cover;
      margin:0 0 15px;
      border-radius:8px;
    }

    .ar-link span{
      display:block;
    }

    .note{
      margin-top:18px;
      font-size:13px;
      color:#829bad;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="kicker">OddPocket</div>

    <h1>Ring of Brodgar</h1>

    <p>
      Open this LiDAR terrain in Apple Quick Look and place it in your space.
    </p>

    <a class="ar-link"
       rel="ar"
       href="../models/terrain.usdz">
      <img src="../images/brodgar-ar-preview.png"
           alt="Ring of Brodgar terrain">
      <span>Open terrain in AR</span>
    </a>

    <p class="note">
      Requires a compatible iPhone or iPad. No app required.
    </p>
  </main>
</body>
</html>
