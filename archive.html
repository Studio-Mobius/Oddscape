<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Terrain Archive | Studio Oddscape</title>

<style>
:root{--gold:#d9bc82;--text:#dce3e8;--muted:#9aa5ac;--line:rgba(217,188,130,.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.page{width:960px;margin:auto;background:radial-gradient(circle at top,#233848 0%,#10212c 45%,#08141d 100%)}
header{text-align:center;padding:55px 40px 30px}
.logo{font-size:74px;font-weight:800;color:var(--gold);line-height:.95}
.subtitle{margin-top:18px;font-size:13px;letter-spacing:6px;color:rgba(220,226,230,.75)}
.hud{width:520px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,rgba(217,188,130,.45),transparent)}
nav{display:flex;justify-content:center;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
nav a{text-decoration:none;color:#dce3e8;padding:16px 34px;font-size:14px;border-right:1px solid var(--line)}
nav a:last-child{border-right:none}
nav a:hover{color:var(--gold)}
.content{padding:60px}
.section-title{font-size:52px;font-weight:800;color:var(--gold);margin-bottom:20px}
.section-rule{height:1px;background:var(--line);margin-bottom:35px}
.intro{max-width:760px;font-size:20px;line-height:1.8;color:#cfd5d9;margin-bottom:45px}
.archive-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{border:1px solid rgba(217,188,130,.18);background:rgba(10,18,24,.18);border-radius:16px;overflow:hidden}
.image-wrap{position:relative}
.image-wrap img{display:block;width:100%}
.badge{position:absolute;left:12px;bottom:12px;background:rgba(10,18,24,.28);border:1px solid rgba(217,188,130,.28);padding:6px 10px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#e6e6e6}
.card-body{padding:24px}
.card-tag{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card h2{font-size:28px;color:var(--gold);margin-bottom:12px}
.card p{font-size:16px;line-height:1.7;color:#cfd5d9}
.card-meta{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.7}
.button-row{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.button{text-decoration:none;padding:10px 16px;border:1px solid rgba(217,188,130,.3);color:var(--gold);letter-spacing:2px;font-size:10px;text-transform:uppercase}
.button:hover{background:rgba(217,188,130,.08)}
.coming{min-height:250px;display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid rgba(217,188,130,.12);color:var(--muted);letter-spacing:3px;text-transform:uppercase;background:rgba(10,18,24,.14)}
footer{text-align:center;padding:60px 40px;margin-top:60px;border-top:1px solid rgba(217,188,130,.12)}
.footer-brand{color:var(--gold);font-size:18px;line-height:1.6}
.footer-text{margin-top:16px;font-size:14px;line-height:1.8;color:#cfd5d9}
.footer-copy{margin-top:24px;font-size:11px;color:#8d98a0}
</style>
</head>

<body>
<div class="page">

<header>
<div class="logo">Studio Oddscape</div>
<div class="subtitle">Terrain Archive // Commissioned Visualisation</div>
<div class="hud"></div>
</header>
