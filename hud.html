<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddscape Header Test</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #36424f 0%, #263442 55%, #1b2530 100%);
    color: #e6e6e6;
    text-align: center;
}

header {
    padding: 60px 20px 30px;
}

h1 {
    margin: 0;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: 6px;
    text-transform: uppercase;

    color: rgba(224,194,122,0.10);
    -webkit-text-stroke: 1.2px rgba(224,194,122,0.95);
    text-shadow: none;
}

.subtitle {
    margin-top: 14px;
    color: rgba(230,230,230,0.82);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.hud-line {
    width: 220px;
    height: 1px;
    background: rgba(224,194,122,0.35);
    margin: 22px auto 0;
}

section {
    max-width: 760px;
    margin: 40px auto;
    padding: 30px 20px;
    text-align: left;
}

h2 {
    color: #e0c27a;
    font-size: 34px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 12px;
}

p {
    font-size: 18px;
    line-height: 1.7;
}

@media (max-width: 700px) {
    h1 {
        font-size: 42px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Oddscape</h1>
    <div class="subtitle">Terrain Archive // Commissioned Visualisation</div>
    <div class="hud-line"></div>
</header>

<section>
    <h2>Terrain Archive</h2>
    <p>
        Ready-to-download terrain interpretation packages for project,
        presentation, education, and landscape analysis.
    </p>
</section>

</body>
</html>
