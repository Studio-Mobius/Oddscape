<title>Studio Oddscape | Terrain Intelligence</title>

<style>

:root{
  --bg:#071421;
  --gold:#c8a66b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at center, rgba(23,50,72,.65), transparent 58%),
    linear-gradient(145deg,#091a2a,#02070c 82%);
  overflow:hidden;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Courier New", monospace;
}

a.stage{
  position:relative;
  display:block;
  width:min(92vw,560px);
  aspect-ratio:9 / 16;
  overflow:hidden;
  border-radius:28px;
  text-decoration:none;

  box-shadow:
    0 40px 120px rgba(0,0,0,.62),
    0 0 0 1px rgba(200,166,107,.12);

  background:#071421;
}

.grid{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(10,1fr);
}

.tile{
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:
    translate(var(--x),var(--y))
    scale(.92);

  filter:blur(2px);

  animation:
    assemble .95s cubic-bezier(.2,.8,.2,1)
    forwards;

  animation-delay:var(--delay);
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.stage::after{

  content:"ENTER TERRAIN SYSTEM";

  position:absolute;
  left:50%;
  bottom:6.5%;

  transform:translateX(-50%);

  font-size:clamp(.65rem,2.2vw,.9rem);
  letter-spacing:.25em;

  color:rgba(200,166,107,.92);

  padding:12px 18px;

  border:1px solid rgba(200,166,107,.55);

  background:rgba(7,20,33,.35);

  opacity:0;

  animation:
    enterFade .5s ease forwards;

  animation-delay:1.05s;

  pointer-events:none;
}

.stage:hover::after{
  background:rgba(200,166,107,.12);
}

@keyframes assemble{
  to{
    opacity:1;
    transform:
      translate(0,0)
      scale(1);

    filter:blur(0);
  }
}

@keyframes enterFade{
  to{
    opacity:1;
  }
}

@media(max-width:700px){

  a.stage{
    width:94vw;
    border-radius:22px;
  }

}

</style>
</head>
