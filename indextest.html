<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Oddscape | Terrain Intelligence</title>

<style>
:root{
  --bg:#071421;
  --bg2:#0d2133;
  --gold:#caa66a;
  --cream:#e8dfce;
  --muted:#7f8d98;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at center, rgba(38,70,96,.38), transparent 45%),
    linear-gradient(145deg,var(--bg),#02070c 80%);
  color:var(--cream);
  font-family: "Courier New", monospace;
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.scene{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
}

.brand{
  text-align:center;
  z-index:5;
  animation:fadeIn 1.2s ease forwards;
}

.brand small{
  display:block;
  letter-spacing:.55em;
  font-size:.75rem;
  color:var(--gold);
  margin-bottom:18px;
}

.brand h1{
  margin:0;
  letter-spacing:.65em;
  font-weight:400;
  font-size:clamp(2rem,5vw,5rem);
  color:var(--gold);
}

.brand p{
  letter-spacing:.35em;
  font-size:.8rem;
  margin:22px 0 38px;
  color:var(--cream);
}

.enter{
  display:inline-block;
  border:1px solid var(--gold);
  padding:18px 34px;
  letter-spacing:.28em;
  color:var(--gold);
  background:rgba(7,20,33,.55);
  box-shadow:0 0 30px rgba(202,166,106,.08);
  transition:.25s;
}

.enter:hover{
  background:rgba(202,166,106,.12);
  box-shadow:0 0 45px rgba(202,166,106,.18);
}

.tiles{
  position:absolute;
  inset:0;
  overflow:hidden;
  opacity:.7;
}

.tile{
  position:absolute;
  width:72px;
  height:72px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.01)),
    radial-gradient(circle at 40% 40%,rgba(160,190,210,.16),transparent 55%);
  border:1px solid rgba(202,166,106,.12);
  box-shadow:inset 0 0 18px rgba(255,255,255,.04);
  animation:assemble 1.4s ease-out forwards;
  transform:translate(var(--x),var(--y)) scale(.7);
  opacity:0;
}

.tile:nth-child(1){left:28%;top:25%;--x:-80px;--y:-40px;animation-delay:.05s}
.tile:nth-child(2){left:34%;top:32%;--x:60px;--y:-70px;animation-delay:.1s}
.tile:nth-child(3){left:41%;top:24%;--x:-90px;--y:70px;animation-delay:.15s}
.tile:nth-child(4){left:48%;top:31%;--x:120px;--y:-90px;animation-delay:.2s}
.tile:nth-child(5){left:55%;top:27%;--x:-50px;--y:110px;animation-delay:.25s}
.tile:nth-child(6){left:62%;top:35%;--x:90px;--y:80px;animation-delay:.3s}
.tile:nth-child(7){left:31%;top:48%;--x:-130px;--y:20px;animation-delay:.35s}
.tile:nth-child(8){left:39%;top:52%;--x:80px;--y:120px;animation-delay:.4s}
.tile:nth-child(9){left:50%;top:50%;--x:-70px;--y:-120px;animation-delay:.45s}
.tile:nth-child(10){left:59%;top:55%;--x:130px;--y:-30px;animation-delay:.5s}
.tile:nth-child(11){left:67%;top:48%;--x:-100px;--y:90px;animation-delay:.55s}
.tile:nth-child(12){left:45%;top:68%;--x:40px;--y:140px;animation-delay:.6s}
.tile:nth-child(13){left:55%;top:70%;--x:-120px;--y:-60px;animation-delay:.65s}

.hud{
  position:absolute;
  inset:36px;
  pointer-events:none;
  border:1px solid rgba(202,166,106,.08);
}

.corner{
  position:absolute;
  width:42px;
  height:42px;
  border-color:var(--gold);
  opacity:.75;
}

.tl{top:0;left:0;border-top:1px solid;border-left:1px solid}
.tr{top:0;right:0;border-top:1px solid;border-right:1px solid}
.bl{bottom:0;left:0;border-bottom:1px solid;border-left:1px solid}
.br{bottom:0;right:0;border-bottom:1px solid;border-right:1px solid}

.meta{
  position:absolute;
  left:48px;
  bottom:48px;
  color:var(--gold);
  font-size:.72rem;
  letter-spacing:.22em;
  line-height:1.8;
  opacity:.8;
}

.topline{
  position:absolute;
  right:48px;
  top:48px;
  color:var(--gold);
  font-size:.72rem;
  letter-spacing:.28em;
  opacity:.8;
}

@keyframes assemble{
  from{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(.65) rotate(4deg);
  }
  to{
    opacity:1;
    transform:translate(0,0) scale(1) rotate(0);
  }
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:700px){
  .brand h1{letter-spacing:.35em}
  .brand p{letter-spacing:.2em}
  .topline{display:none}
  .meta{font-size:.6rem;left:28px;bottom:28px}
}
</style>
</head>

<body>
<a href="home.html" aria-label="Enter Studio Oddscape terrain system">
  <main class="scene">

    <div class="tiles">
      <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div>
    </div>

    <div class="hud">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

    <div class="topline">LIDAR · REM · SPATIAL INTERPRETATION</div>

    <section class="brand">
      <small>STUDIO ODDSCAPE</small>
      <h1>ODDSCAPE</h1>
      <p>TERRAIN INTELLIGENCE</p>
      <span class="enter">ENTER TERRAIN SYSTEM</span>
    </section>

    <div class="meta">
      UK TERRAIN SYSTEM<br>
      REV 01<br>
      OSGB36 / BRITISH NATIONAL GRID
    </div>

  </main>
</a>
</body>
</html>
