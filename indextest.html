<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Oddscape | Terrain Intelligence</title>

<style>
:root{
  --blue:#071827;
  --blue2:#0d2538;
  --gold:#c8a66b;
  --cream:#e9dfcb;
  --line:rgba(200,166,107,.7);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at center, rgba(38,72,98,.55), transparent 55%),
    linear-gradient(145deg,#0b2234,#02070b 85%);
  font-family:"Courier New", monospace;
  color:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.card{
  width:min(88vw,520px);
  aspect-ratio: 2 / 3.15;
  position:relative;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.04), transparent 45%),
    linear-gradient(145deg,var(--blue2),var(--blue));
  border-radius:26px;
  padding:46px 34px;
  box-shadow:
    0 40px 100px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.05);
  overflow:hidden;
  animation:rise .8s ease forwards;
}

.card:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:42px 42px;
  opacity:.35;
}

.card:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 40% 30%, rgba(255,255,255,.08), transparent 12%),
    radial-gradient(circle at 60% 62%, rgba(255,255,255,.05), transparent 18%);
  opacity:.55;
}

.content{
  position:relative;
  z-index:2;
  height:100%;
  text-align:center;
}

.corner{
  position:absolute;
  width:52px;
  height:52px;
  border-color:var(--line);
  z-index:3;
}

.tl{top:28px;left:28px;border-top:2px solid;border-left:2px solid}
.tr{top:28px;right:28px;border-top:2px solid;border-right:2px solid}
.bl{bottom:28px;left:28px;border-bottom:2px solid;border-left:2px solid}
.br{bottom:28px;right:28px;border-bottom:2px solid;border-right:2px solid}

.meta{
  position:absolute;
  top:44px;
  left:72px;
  text-align:left;
  color:var(--gold);
  font-size:.7rem;
  line-height:1.7;
  letter-spacing:.16em;
}

.meta-right{
  position:absolute;
  top:44px;
  right:72px;
  text-align:right;
  color:var(--gold);
  font-size:.7rem;
  line-height:1.7;
  letter-spacing:.16em;
}

.cross{
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  color:var(--gold);
  font-size:2rem;
  opacity:.75;
}

.brand{
  position:absolute;
  top:27%;
  left:0;
  right:0;
}

.brand small{
  display:block;
  letter-spacing:.55em;
  font-size:.8rem;
  margin-bottom:16px;
}

.brand h1{
  margin:0;
  color:var(--gold);
  font-size:clamp(2.2rem,9vw,4.6rem);
  letter-spacing:.32em;
  font-weight:400;
  text-shadow:0 2px 8px rgba(0,0,0,.7);
}

.brand p{
  margin-top:24px;
  letter-spacing:.32em;
  font-size:.78rem;
}

.qr{
  width:180px;
  height:180px;
  margin:0 auto;
  background:#efe7d8;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-20%);
  border-radius:8px;
  box-shadow:
    0 0 0 10px rgba(0,0,0,.3),
    inset 0 0 0 8px rgba(255,255,255,.4);
  display:grid;
  place-items:center;
  color:#061421;
  font-size:.7rem;
  letter-spacing:.12em;
}

.qr::before{
  content:"QR";
  font-size:3.2rem;
  font-weight:bold;
  letter-spacing:.05em;
}

.scan{
  position:absolute;
  top:68%;
  left:0;
  right:0;
  color:var(--gold);
  letter-spacing:.28em;
  font-size:.78rem;
}

.enter{
  position:absolute;
  left:12%;
  right:12%;
  bottom:16%;
  border:1px solid var(--line);
  color:var(--gold);
  padding:18px 12px;
  letter-spacing:.28em;
  font-size:.85rem;
  transition:.25s;
}

.card:hover .enter{
  background:rgba(200,166,107,.1);
  box-shadow:0 0 35px rgba(200,166,107,.18);
}

.footer{
  position:absolute;
  bottom:54px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 62px;
  color:var(--gold);
  font-size:.72rem;
  letter-spacing:.18em;
}

@keyframes rise{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:600px){
  .card{
    width:88vw;
    border-radius:22px;
    padding:34px 24px;
  }

  .meta,.meta-right{
    font-size:.55rem;
    top:38px;
  }

  .meta{left:58px}
  .meta-right{right:58px}

  .brand h1{
    letter-spacing:.22em;
  }

  .qr{
    width:145px;
    height:145px;
  }

  .footer{
    padding:0 48px;
    font-size:.58rem;
  }
}
</style>
</head>

<body>
<a href="home.html" aria-label="Enter Studio Oddscape">
  <main class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="content">
      <div class="meta">UK TERRAIN SYSTEM<br>REV 01</div>
      <div class="meta-right">TM 465 560<br>LINCOLNSHIRE / SUFFOLK</div>

      <div class="cross">+</div>

      <section class="brand">
        <small>STUDIO</small>
        <h1>ODDSCAPE</h1>
        <p>TERRAIN INTELLIGENCE</p>
      </section>

      <div class="qr"></div>
      <div class="scan">SCAN TO DEPLOY</div>

      <div class="enter">ENTER TERRAIN SYSTEM</div>

      <div class="footer">
        <span>LIDAR / REM</span>
        <span>ELEV INT</span>
      </div>
    </div>
  </main>
</a>
</body>
</html>
