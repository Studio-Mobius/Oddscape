<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Oddscape | Terrain Intelligence</title>

<meta name="description" content="Studio Oddscape — terrain intelligence, LiDAR, REM and spatial interpretation.">

<style>

:root{
  --gold:#c8a66b;
  --paper:#e7ddcf;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at center,
    rgba(23,50,72,.60),
    transparent 58%),
    linear-gradient(
    145deg,
    #091a2a,
    #02070c 82%);
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

.stage{
  position:relative;

  display:block;

  width:min(94vw,620px);

  aspect-ratio:900 / 1280;

  overflow:hidden;

  text-decoration:none;

  color:inherit;

  box-shadow:
    0 40px 120px rgba(0,0,0,.62);

  border-radius:28px;
}

/* TILE GRID */

.grid{
  position:absolute;
  inset:0;

  display:grid;

  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(18,1fr);
}

.tile{
  overflow:hidden;

  opacity:0;

  transform:
    translate(var(--x),var(--y))
    scale(.93);

  filter:blur(2px);

  animation:
    assemble .9s cubic-bezier(.2,.8,.2,1)
    forwards;

  animation-delay:var(--delay);
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* APERTURE */

.aperture{

  position:absolute;

  left:30.1%;
  top:37.6%;

  width:39.8%;
  height:27.7%;

  border-radius:10px;

  overflow:hidden;

  z-index:10;

  background:var(--paper);

  box-shadow:
    inset 0 0 24px rgba(0,0,0,.2);

  opacity:0;

  animation:
    slotIn .45s ease forwards;

  animation-delay:1.25s;
}

/* QR MODE */

.qr-mode .aperture::before{

  content:"";

  position:absolute;

  inset:7%;

  background-image:url("https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https%3A%2F%2Fwww.oddscape.co.uk%2Findexx.html");

  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;

  image-rendering:pixelated;
}

/* TERRAIN MODE */

.terrain-mode .aperture::before{

  content:"";

  position:absolute;

  inset:-18%;

  background:
    radial-gradient(circle at 30% 40%,
    rgba(255,255,255,.22),
    transparent 18%),

    radial-gradient(circle at 65% 60%,
    rgba(200,166,107,.18),
    transparent 22%),

    repeating-linear-gradient(
    25deg,
    rgba(7,20,33,.85) 0 4px,
    rgba(231,221,207,.22) 4px 6px);

  animation:
    terrainSpin 8s linear infinite;
}

/* CTA */

.stage::after{

  content:"CLICK TO ENTER";

  position:absolute;

  left:50%;
  bottom:2.5%;

  transform:translateX(-50%);

  letter-spacing:.22em;

  color:rgba(200,166,107,.9);

  font-size:
    clamp(.55rem,1.8vw,.75rem);

  opacity:0;

  animation:
    slotIn .45s ease forwards;

  animation-delay:1.35s;
}

/* ANIMATION */

@keyframes assemble{

  to{
    opacity:1;

    transform:
      translate(0,0)
      scale(1);

    filter:blur(0);
  }
}

@keyframes slotIn{

  to{
    opacity:1;
  }
}

@keyframes terrainSpin{

  from{
    transform:
      rotate(0deg)
      scale(1.05);
  }

  to{
    transform:
      rotate(360deg)
      scale(1.05);
  }
}

/* MOBILE */

@media(max-width:700px){

  .stage{
    width:96vw;
  }

}

</style>
</head>

<!-- CHANGE qr-mode TO terrain-mode FOR ROTATING TERRAIN -->

<body class="qr-mode">

<a class="stage"
href="home.html"
aria-label="Enter Studio Oddscape terrain system">

<div class="grid">

<!-- ROW 1 -->

<div class="tile" style="--delay:.01s;--x:-50px;--y:-30px;"><img src="images/card_tiles/tile-r01-c01.jpg"></div>
<div class="tile" style="--delay:.02s;--x:-30px;--y:-20px;"><img src="images/card_tiles/tile-r01-c02.jpg"></div>
<div class="tile" style="--delay:.03s;--x:-10px;--y:-10px;"><img src="images/card_tiles/tile-r01-c03.jpg"></div>
<div class="tile" style="--delay:.04s;--x:10px;--y:-20px;"><img src="images/card_tiles/tile-r01-c04.jpg"></div>
<div class="tile" style="--delay:.05s;--x:20px;--y:-10px;"><img src="images/card_tiles/tile-r01-c05.jpg"></div>
<div class="tile" style="--delay:.06s;--x:40px;--y:-30px;"><img src="images/card_tiles/tile-r01-c06.jpg"></div>

<!-- DUPLICATE / CONTINUE ALL TILES -->

</div>

<div class="aperture"></div>

</a>

</body>
</html>
