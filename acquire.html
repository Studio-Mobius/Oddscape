:root{--gold:#d9bc82;--text:#dce3e8;--muted:#9aa5ac;--line:rgba(217,188,130,.15)}

body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.page{
  width:min(960px,100%);
  margin:0 auto;
  background:radial-gradient(circle at top,#233848 0%,#10212c 45%,#08141d 100%);
  overflow:hidden;
}

header{
  text-align:center;
  padding:55px 40px 30px;
}

.logo{
  display:block;
  font-size:clamp(42px,8vw,74px);
  font-weight:800;
  color:var(--gold);
  line-height:.95;
  text-decoration:none;
}

.subtitle{
  margin-top:18px;
  font-size:13px;
  letter-spacing:6px;
  color:rgba(220,226,230,.75);
}

.hud{
  width:520px;
  max-width:80%;
  height:24px;
  margin:22px auto;
  position:relative;
}

.hud::before,
.hud::after{
  content:"";
  position:absolute;
  top:50%;
  width:calc(50% - 24px);
  height:1px;
}

.hud::before{
  left:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(217,188,130,.55)
  );
}

.hud::after{
  right:0;
  background:linear-gradient(
    90deg,
    rgba(217,188,130,.55),
    transparent
  );
}

.hud-marker{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
}

.hud-marker svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:var(--gold);
  stroke-width:1.4;
  stroke-linecap:round;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
}

nav a{
  text-decoration:none;
  color:var(--text);
  padding:16px 34px;
  font-size:14px;
  border-right:1px solid var(--line);
}

nav a:last-child{
  border-right:none;
}

nav a:hover{
  color:var(--gold);
}

<div class="section-title">Start a Project</div>
<div class="section-rule"></div>
<div class="intro">
Acquire an existing terrain study from the Oddscape Archive or commission a custom terrain model for your own site. Terrain packages can include high-resolution visualisations, LiDAR-derived terrain models, AR-ready USDZ files, hillshade studies, REM analysis and bespoke landscape interpretation.
</div>
<div class="panel">
<h2>How It Works</h2>
<p>
Whether you need a terrain model for a planning presentation, heritage project, landscape study, educational resource or personal interest, the process is straightforward:
</p>

<h3>Browse the Archive</h3>
<p>Choose from existing Oddscape terrain studies available for licensing.</p>
</div>
<div class="payment-card">
<h3>Request a Site</h3>
<p>Provide a location, grid reference or project boundary for a custom commission.</p>
</div>
<div class="payment-card">
<h3>Receive a Quote</h3>
<p>Pricing is based on site size, data availability, outputs and project complexity.</p>
</div>
<div class="payment-card">
<h3>Approve the Project</h3>
<p>Once approved, terrain processing and visualisation work begins.</p>
</div>
<div class="payment-card">
<h3>Receive Your Package</h3>
<p>Outputs can include imagery, AR models, terrain meshes, DEMs, REMs and supporting material.</p>
</div>
<div class="payment-card">
<h3>Use With Confidence</h3>
<p>Licences are issued for named projects, organisations or educational use as appropriate.</p>
