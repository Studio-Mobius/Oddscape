<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Oddscape — Ness of Brodgar</title>

<style>
:root{
    --gold:#d9bc82;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.stage{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Complete Oddscape gold frame */

.qr-frame{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:17px;

    border:2px solid rgba(217,188,130,.88);
    border-radius:12px;

    background:transparent;

    box-shadow:
        0 0 12px rgba(217,188,130,.12),
        inset 0 0 9px rgba(217,188,130,.045);

    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
}

/* Prevent old decorative frame rules appearing */

.qr-frame::before,
.qr-frame::after{
    display:none;
    content:none;
}

/* QR size */

.qr-creature{
    width:min(150px,52vw);
    aspect-ratio:1;
    transform-origin:center center;
    will-change:transform;
}

.qr-image{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
}

/* Invisible support element used by the JavaScript */

.animation-support{
    display:none !important;
}

/* Movement classes */

.qr-creature.shiver-small{
    animation:shiverSmall .24s linear;
}

.qr-creature.shiver-medium{
    animation:shiverMedium .34s linear;
}

.qr-creature.shiver-double{
    animation:shiverDouble .58s linear;
}

.qr-creature.spin{
    animation:qrSpin .72s cubic-bezier(.45,.05,.55,.95);
}

.qr-creature.frozen{
    animation:none !important;
    transform:none !important;
}

/* Small jitter */

@keyframes shiverSmall{
    0%   {transform:translate(0,0) rotate(0deg);}
    10%  {transform:translate(-3px,1px) rotate(-1deg);}
    20%  {transform:translate(3px,-1px) rotate(1deg);}
    30%  {transform:translate(-2px,-2px) rotate(-.8deg);}
    40%  {transform:translate(2px,2px) rotate(.8deg);}
    50%  {transform:translate(-3px,0) rotate(-1.1deg);}
    60%  {transform:translate(3px,0) rotate(1.1deg);}
    72%  {transform:translate(-1px,1px) rotate(-.4deg);}
    84%  {transform:translate(1px,-1px) rotate(.4deg);}
    100% {transform:translate(0,0) rotate(0deg);}
}

/* Stronger jitter */

@keyframes shiverMedium{
    0%   {transform:translate(0,0) rotate(0deg);}
    7%   {transform:translate(-4px,1px) rotate(-1.4deg);}
    14%  {transform:translate(4px,-1px) rotate(1.4deg);}
    21%  {transform:translate(-3px,-2px) rotate(-1deg);}
    28%  {transform:translate(3px,2px) rotate(1deg);}
    36%  {transform:translate(-4px,0) rotate(-1.5deg);}
    44%  {transform:translate(4px,0) rotate(1.5deg);}
    54%  {transform:translate(-2px,2px) rotate(-.8deg);}
    64%  {transform:translate(2px,-2px) rotate(.8deg);}
    76%  {transform:translate(-1px,0) rotate(-.3deg);}
    88%  {transform:translate(1px,0) rotate(.3deg);}
    100% {transform:translate(0,0) rotate(0deg);}
}

/* Double nervous twitch */

@keyframes shiverDouble{
    0%   {transform:translate(0,0) rotate(0deg);}
    6%   {transform:translate(-4px,1px) rotate(-1.5deg);}
    12%  {transform:translate(4px,-1px) rotate(1.5deg);}
    18%  {transform:translate(-3px,-2px) rotate(-1.1deg);}
    24%  {transform:translate(3px,2px) rotate(1.1deg);}
    31%  {transform:translate(0,0) rotate(0deg);}
    43%  {transform:translate(-5px,0) rotate(-1.7deg);}
    50%  {transform:translate(5px,1px) rotate(1.7deg);}
    57%  {transform:translate(-3px,-1px) rotate(-1deg);}
    64%  {transform:translate(3px,1px) rotate(1deg);}
    73%  {transform:translate(-2px,0) rotate(-.6deg);}
    82%  {transform:translate(2px,0) rotate(.6deg);}
    91%  {transform:translate(-1px,0) rotate(-.2deg);}
    100% {transform:translate(0,0) rotate(0deg);}
}

/* Occasional full spin */

@keyframes qrSpin{
    0%{
        transform:rotate(0deg) scale(1);
    }

    25%{
        transform:rotate(90deg) scale(.96);
    }

    50%{
        transform:rotate(180deg) scale(.94);
    }

    75%{
        transform:rotate(270deg) scale(.96);
    }

    100%{
        transform:rotate(360deg) scale(1);
    }
}

@media(max-width:520px){
    .page{
        padding:16px;
    }

    .qr-frame{
        padding:15px;
    }

    .qr-creature{
        width:min(142px,56vw);
    }
}

@media(prefers-reduced-motion:reduce){
    .qr-creature{
        animation:none !important;
        transform:none !important;
    }
}



/* Logo-to-QR reveal */

.reveal-stage{
    position:relative;
    width:min(150px,52vw);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.reveal-logo{
    position:absolute;
    inset:0;
    margin:auto;
    width:72%;
    height:72%;
    object-fit:contain;
    opacity:1;
    transform:scale(1);
    transition:
        opacity .46s ease,
        transform .46s ease,
        filter .46s ease;
    filter:drop-shadow(0 0 8px rgba(217,188,130,.16));
    pointer-events:none;
}

.qr-creature{
    width:100% !important;
    opacity:0;
    transform:scale(.82);
    transition:
        opacity .46s ease,
        transform .46s ease;
}

.reveal-stage.qr-visible .reveal-logo{
    opacity:0;
    transform:scale(.72);
    filter:drop-shadow(0 0 18px rgba(217,188,130,.08));
}

.reveal-stage.qr-visible .qr-creature{
    opacity:1;
    transform:scale(1);
}

@media(max-width:520px){
    .reveal-stage{
        width:min(142px,56vw);
    }
}


/* ODDSCAPE LOGO QR SEQUENCE — BEGIN */

.reveal-logo.logo-spin{
    animation:oddscapeLogoSpin .65s ease-in-out;
}

@keyframes oddscapeLogoSpin{
    0%{
        transform:rotate(0deg) scale(1);
    }

    45%{
        transform:rotate(180deg) scale(.92);
    }

    100%{
        transform:rotate(360deg) scale(1);
    }
}

/* Keep the transition between logo and QR clean. */

.reveal-logo{
    transition:
        opacity .38s ease,
        transform .38s ease,
        filter .38s ease;
}

.reveal-stage .qr-creature{
    transition:
        opacity .38s ease,
        transform .38s ease;
}

/* ODDSCAPE LOGO QR SEQUENCE — END */


/* ODDSCAPE METHODOLOGY FOOTER LINK — BEGIN */
.methodology-footer-link{
  max-width:860px;
  margin:56px auto 0;
  padding:28px 24px;
  text-align:center;
  border-top:1px solid rgba(217,188,130,.22);
}

.methodology-footer-link .methodology-kicker{
  margin:0 0 10px;
  color:var(--muted, #9aa5ac);
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
}

.methodology-footer-link a{
  display:inline-block;
  color:var(--gold, #d9bc82);
  font-size:13px;
  font-weight:700;
  letter-spacing:.14em;
  text-decoration:none;
  text-transform:uppercase;
}

.methodology-footer-link a:hover,
.methodology-footer-link a:focus{
  text-decoration:underline;
}
/* ODDSCAPE METHODOLOGY FOOTER LINK — END */


/* ==========================================================
   ODDSCAPE HEADER MKIII
   ========================================================== */

nav{
    display:flex;
    justify-content:space-around;
    align-items:center;
    gap:18px;
    width:100%;
    margin:0;
    padding:0 18px;
    border-top:1px solid rgba(217,188,130,.22);
    border-bottom:1px solid rgba(217,188,130,.22);
}

nav a{
    flex:0 1 auto;
    padding:18px 0;
    border:none !important;
    background:none !important;
    text-decoration:none;
    text-align:center;
    white-space:nowrap;
    letter-spacing:.12em;
    transition:.25s;
}

nav a:hover{
    color:var(--gold);
}

@media(max-width:760px){

    nav{
        gap:8px;
        padding:0 10px;
    }

    nav a{
        font-size:11px;
        letter-spacing:.08em;
        padding:18px 0;
    }
}

/* ==========================================================
   END HEADER MKIII
   ========================================================== */

</style>
</head>

<body>
<main class="page">
    <section class="stage">

        <a
            class="qr-frame"
            id="qrLink"
            href="https://oddscape.co.uk/pocket/brodgar.html"
            aria-label="Open the Ness of Brodgar OddPocket"
        >
            <div class="reveal-stage" id="revealStage">

                <img
                    class="reveal-logo"
                    id="revealLogo"
                    src="../images/Oddbrand/Ologoalpha.png"
                    alt="Oddscape"
                >

                <div
                    class="qr-creature"
                    id="qrCreature"
                >
                    <img
                        class="qr-image"
                        src="qr.png"
                        alt="Scan to open the Ness of Brodgar OddPocket"
                    >
                </div>

            </div>
        </a>

        <p
            id="caption"
            class="animation-support"
            aria-hidden="true"
        ></p>

    </section>
</main>

<script>
const revealStage = document.getElementById("revealStage");
const revealLogo = document.getElementById("revealLogo");
const qrCreature = document.getElementById("qrCreature");
const qrLink = document.getElementById("qrLink");

const movementClasses = [
    "shiver-small",
    "shiver-medium",
    "shiver-double",
    "spin",
    "frozen"
];

let paused = false;
let running = false;

function wait(milliseconds){
    return new Promise(resolve => {
        window.setTimeout(resolve, milliseconds);
    });
}

async function waitUntilReleased(){
    while(paused){
        await wait(100);
    }
}

function clearQrMotion(){
    movementClasses.forEach(className => {
        qrCreature.classList.remove(className);
    });
}

function restartClass(element,className){
    element.classList.remove(className);

    void element.offsetWidth;

    element.classList.add(className);
}

function animationFinished(element){
    return new Promise(resolve => {
        element.addEventListener(
            "animationend",
            resolve,
            {once:true}
        );
    });
}

async function logoSpin(){
    restartClass(revealLogo,"logo-spin");
    await animationFinished(revealLogo);
    revealLogo.classList.remove("logo-spin");
}

async function qrMove(className){
    clearQrMotion();
    restartClass(qrCreature,className);
    await animationFinished(qrCreature);
    qrCreature.classList.remove(className);
}

async function runSequence(){
    if(running){
        return;
    }

    running = true;

    while(true){

        /*
        1. Logo remains visible for one second.
        */

        revealStage.classList.remove("qr-visible");
        clearQrMotion();

        await waitUntilReleased();
        await wait(1000);

        /*
        2. Logo performs one full spin.
        */

        await waitUntilReleased();
        await logoSpin();

        /*
        3. Cross-fade from logo to QR.
        */

        revealStage.classList.add("qr-visible");

        await waitUntilReleased();
        await wait(500);

        /*
        4. QR jitters.
        */

        await qrMove("shiver-double");

        await waitUntilReleased();
        await wait(900);

        /*
        5. QR performs one full spin.
        */

        await qrMove("spin");

        await waitUntilReleased();
        await wait(900);

        /*
        6. QR jitters again.
        */

        await qrMove("shiver-medium");

        await waitUntilReleased();
        await wait(1200);

        /*
        Then return to the logo and repeat.
        */
    }
}

function gentleBuzz(){
    if("vibrate" in navigator){
        navigator.vibrate([30,45,30]);
    }
}

function pauseSequence(){
    paused = true;
    clearQrMotion();
    qrCreature.classList.add("frozen");
}

function resumeSequence(){
    paused = false;
    qrCreature.classList.remove("frozen");
}

qrLink.addEventListener("mouseenter",pauseSequence);
qrLink.addEventListener("mouseleave",resumeSequence);

qrLink.addEventListener(
    "touchstart",
    () => {
        gentleBuzz();
        pauseSequence();

        window.setTimeout(
            resumeSequence,
            10000
        );
    },
    {passive:true}
);

qrLink.addEventListener("focus",pauseSequence);
qrLink.addEventListener("blur",resumeSequence);

runSequence();
</script>
