<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orford Ness 3D Model</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:#08141d;
}
model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  src="images/OrfordNess.glb"
  alt="Orford Ness 3D terrain model"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  style="width:100%;height:70vh;background:#08141d;">
</model-viewer>

</body>
</html>
